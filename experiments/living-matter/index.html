<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Matter — estudio híbrido</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#030505;color:#afbfbc;font:14px system-ui,sans-serif;min-height:100vh;display:grid;place-content:center}main{width:min(100vw,1440px)}canvas{display:block;width:100%;aspect-ratio:12/5;background:#030505}nav{display:flex;align-items:center;gap:16px;padding:20px 24px;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#12201e;border:1px solid #425852;border-radius:4px;padding:8px 14px}input{flex:1;min-width:140px;accent-color:#b5a377}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #e6d6a7;outline-offset:4px}output{font-variant-numeric:tabular-nums}#error{padding:16px;color:#ebc8b6}
</style>
<main>
<canvas id="shot" width="1440" height="600" aria-label="Estudio visual: una materia filamentosa gana cohesión y concentra su luz"></canvas>
<nav aria-label="Controles del estudio">
<button id="play" type="button">Reproducir</button>
<label>Variante <select id="variant"><option value="1">1 — transición común</option><option value="2">2 — organización localizada</option></select></label>
<input id="time" aria-label="Tiempo del estudio" type="range" min="0" max="7" step="0.01" value="0">
<output id="clock">0.00 / 7 s</output>
</nav>
<p id="error" role="status" hidden></p>
</main>
<script type="module" src="./shot.js"></script>
</html>
